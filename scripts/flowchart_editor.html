<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>流程图编辑器</title><style>
body{margin:0;font:13px sans-serif;background:#f4f4f4}#app{display:flex;height:100vh}
#bar{width:150px;padding:10px;background:#fff;border-right:1px solid #ccc}#wrap{flex:1;position:relative}
#panel{width:240px;background:#fff;border-left:1px solid #ccc;padding:10px;font-size:12px;display:none;overflow-y:auto}
button,select,input{width:100%;box-sizing:border-box;margin:4px 0;padding:5px}button{background:#4a90d9;color:#fff;border:none;border-radius:4px;cursor:pointer}
.edge{border:1px solid #ddd;padding:4px;margin:4px 0;background:#fafafa}.hint{font-size:11px;color:#666;line-height:1.6}
</style></head><body><div id="app"><div id="bar"><h3>节点</h3>
<button onclick="add('terminator','开始/结束')">开始 / 结束</button>
<button onclick="add('rectangle','操作')">操作 / 步骤</button>
<button onclick="add('decision','判断')">判断 / 决策</button>
<h3>连线</h3><button id="lk" onclick="arm()">选中起点后点此连线</button>
<button style="background:#27ae60" onclick="save()">导出 JSON 保存</button>
<div class="hint">双击空白=加节点(自动改名)<br>双击节点=改名<br>单击=选中(右侧组件设置)<br>连线：选起点→点此→点终点<br>连线文字在面板改<br>Delete 删节点 · Esc 取消</div>
</div><div id="wrap"><canvas id="cv"></canvas></div><div id="panel"></div></div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),panel=document.getElementById('panel'),wrap=document.getElementById('wrap'),lk=document.getElementById('lk');
let ns=[],sel=null,drag=null,ox=0,oy=0,from=null;
function rs(){cv.width=wrap.clientWidth;cv.height=wrap.clientHeight;draw()}rs();addEventListener('resize',rs);
function hit(mx,my){for(let i=ns.length-1;i>=0;i--){const n=ns[i],dx=Math.abs(mx-n.x),dy=Math.abs(my-n.y);if(n.shape==='terminator'?(dx*dx)/3364+(dy*dy)/841<1:n.shape==='decision'?dx/61+dy/35<1:dx<58&&dy<25)return n}return null}
function bd(n,dx,dy){const h=Math.hypot(dx,dy)||1,ux=Math.abs(dx/h)+1e-6,uy=Math.abs(dy/h)+1e-6;return 5+Math.min(200,n.shape==='decision'?1/(ux/58+uy/32):n.shape==='terminator'?1/Math.hypot(ux/55,uy/26):Math.min(55/ux,22/uy))}function pt(a,b){const dx=b.x-a.x,dy=b.y-a.y,h=Math.hypot(dx,dy)||1,r=bd(a,dx,dy);return{x:a.x+dx/h*r,y:a.y+dy/h*r}}
function add(s,l,e){const rc=cv.getBoundingClientRect();ns.push({id:'n'+Date.now()+'_'+ns.length,label:l,shape:s,x:e?e.clientX-rc.left:80+Math.random()*300,y:e?e.clientY-rc.top:80+Math.random()*200,next:[]});sel=ns[ns.length-1];render();foc()}
function del(){if(!sel)return;const id=sel.id;ns=ns.filter(n=>n.id!==id);ns.forEach(n=>n.next=n.next.filter(e=>e.target!==id));sel=null;render()}
function arm(){if(!sel){alert('请先单击选中起点节点');return}from=sel;lk.textContent='请点击终点节点…'}
function rel(e){const rc=cv.getBoundingClientRect();return[e.clientX-rc.left,e.clientY-rc.top]}cv.onmousedown=e=>{const p=rel(e),n=hit(p[0],p[1]);
 if(from){if(n&&n!==from)from.next.push({target:n.id,label:''});from=null;lk.textContent='选中起点后点此连线';render();return}
 sel=n;if(n){drag=n;ox=p[0]-n.x;oy=p[1]-n.y}render()};
cv.onmousemove=e=>{if(drag){const p=rel(e);drag.x=p[0]-ox;drag.y=p[1]-oy;draw()}};addEventListener('mouseup',()=>drag=null);
function foc(){const i=panel.querySelector('input');if(i){i.focus();i.select()}}cv.ondblclick=e=>{const p=rel(e),n=hit(p[0],p[1]);if(n){sel=n;render();foc()}else add('rectangle','新步骤',e)};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 if(e.key==='Delete')del();if(e.key==='Escape'){from=null;lk.textContent='选中起点后点此连线';render()}});
function draw(){x.clearRect(0,0,cv.width,cv.height);
 ns.forEach(a=>a.next.forEach(en=>{const b=ns.find(n=>n.id===en.target);if(!b)return;
  const p=pt(a,b),q=pt(b,a),an=Math.atan2(q.y-p.y,q.x-p.x);
 x.strokeStyle='#666';x.lineWidth=1.6;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke();
 x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x-12*Math.cos(an-.4),q.y-12*Math.sin(an-.4));x.lineTo(q.x-12*Math.cos(an+.4),q.y-12*Math.sin(an+.4));x.closePath();x.fillStyle='#666';x.fill();
 if(en.label){x.font='11px sans-serif';const w=x.measureText(en.label).width+6;x.fillStyle='#fff';x.fillRect((p.x+q.x)/2-w/2,(p.y+q.y)/2-8,w,14);x.fillStyle='#c0392b';x.textAlign='center';x.textBaseline='middle';x.fillText(en.label,(p.x+q.x)/2,(p.y+q.y)/2)}}));
 ns.forEach(n=>{x.fillStyle=n===sel?'#ffe082':n===from?'#bbdefb':'#fff';x.strokeStyle=n===sel?'#e67e22':'#333';x.lineWidth=2;
 if(n.shape==='terminator'){x.beginPath();x.ellipse(n.x,n.y,55,26,0,0,7);x.fill();x.stroke()}
 else if(n.shape==='decision'){x.beginPath();x.moveTo(n.x,n.y-32);x.lineTo(n.x+58,n.y);x.lineTo(n.x,n.y+32);x.lineTo(n.x-58,n.y);x.closePath();x.fill();x.stroke()}
 else{x.fillRect(n.x-55,n.y-22,110,44);x.strokeRect(n.x-55,n.y-22,110,44)}
 x.fillStyle='#000';x.font='12px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(n.label,n.x,n.y)})}
function show(){if(!sel){panel.style.display='none';return}panel.style.display='block';
 const outs=sel.next.map((en,i)=>{const b=ns.find(n=>n.id===en.target);return `<div class="edge">→ ${b?b.label:'(失效)'}<input value="${(en.label||'').replace(/"/g,'&quot;')}" placeholder="连线文字(如 是/否)" oninput="sel.next[${i}].label=this.value;draw()"><button style="background:#c0392b" onclick="sel.next.splice(${i},1);render()">删除连线</button></div>`}).join('');
 panel.innerHTML=`<h3>组件设置</h3><label>名称</label><input value="${sel.label.replace(/"/g,'&quot;')}" oninput="sel.label=this.value;draw()" onkeydown="if(event.key==='Enter')this.blur()">
<label>类型</label><select onchange="sel.shape=this.value;draw()"><option value="rectangle" ${sel.shape==='rectangle'?'selected':''}>操作 / 步骤</option><option value="decision" ${sel.shape==='decision'?'selected':''}>判断 / 决策</option><option value="terminator" ${sel.shape==='terminator'?'selected':''}>开始 / 结束</option></select>
<label>输出连线</label>${outs||'<i>无（用左侧连线）</i>'}<button style="background:#c0392b" onclick="del()">删除节点</button>`}
function render(){draw();show()}
function save(){fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(ns.map(n=>({id:n.id,label:n.label,shape:n.shape,next:n.next})))}).then(r=>r.text()).then(t=>alert(t)).catch(()=>alert('请通过 python flowchart_editor.py 启动以保存'))}
render();
</script></body></html>
